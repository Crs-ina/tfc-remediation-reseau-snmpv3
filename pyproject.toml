[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "okapi-remediation"
version = "1.0.0"
description = "OKAPI network remediation system"
requires-python = ">=3.12"

[project.scripts]
okapi = "app.cli.entrypoint:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["app*"]
